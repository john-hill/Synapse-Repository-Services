  build_and_test:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ ${{ env.user }} ]; then
            echo "user=${{ env.user }}" >> $GITHUB_ENV
          else
            echo "user=p3bhoff" >> $GITHUB_ENV
            # echo "user=$GITHUB_REPOSITORY_OWNER" >> $GITHUB_ENV
          fi

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          # we have to start with this role or we run into trouble when getting an sts token for the role, below
          role-to-assume: arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-ops-dev
          aws-region: us-east-1
          # eight hours
          role-duration-seconds: 28800

      - name: Build and Test
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: plfm9092
