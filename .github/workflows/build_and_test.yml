name: main

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['*']

jobs:
  build_and_test:
    permissions:
      # https://graphite.dev/guides/github-actions-permissions
      id-token: write
      contents: read
      deployments: write
      security-events: write
      statuses: write
      actions: write
      checks: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ ${{ env.user }} ]; then
            echo "user=${{ env.user }}" >> $GITHUB_ENV
          else
            echo "user=p3bhoff" >> $GITHUB_ENV
            # echo "user=$GITHUB_REPOSITORY_OWNER" >> $GITHUB_ENV
          fi
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          # TODO we should create a role for dev' repo's to use
          role-to-assume: arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-ops-dev
          aws-region: us-east-1
          # eight hours
          role-duration-seconds: 28800

      - name: checkout
        uses: actions/checkout@v5

      - name: Deploy CodePipeline to AWS CloudFormation
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          # TODO give it a unique name
          name: CodePipeline
          template: configuration/build/codepipeline_cf_template.yaml
          parameter-overrides: >-
            SynapseBranch=${{ env.branch }},
            SynapseRepoOwner=${{ github.repository_owner }},
            GitHubToken=${{ secrets.GITHUB_TOKEN }},
            BuildParamUser=${{ env.user }}
