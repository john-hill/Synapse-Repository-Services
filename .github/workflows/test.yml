name: main

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['*']

jobs:
  build_and_test:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ ${{ env.user }} ]; then
            echo "user=${{ env.user }}" >> $GITHUB_ENV
          else
            echo "user=p3bhoff" >> $GITHUB_ENV
            # echo "user=$GITHUB_REPOSITORY_OWNER" >> $GITHUB_ENV
          fi

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          # TODO I'm not really sure what this does.  Can we just use the service role created for the CodeBuild project?
          # TODO What if we just omit this altogether?
          # role-to-assume: arn:aws:iam::449435941126:role/service-role/codebuild-plfm9092-service-role
          role-to-assume: arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-ops-dev
          aws-region: us-east-1

      - name: Build and Test
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: plfm9092
          buildspec-override: |
            version: 0.2
            env:
              variables:
                stack: dev
                user: ${{ env.user }}
                org_sagebionetworks_repository_database_connection_url: dev-${{ env.user }}-db.cdusmwdhqvso.us-east-1.rds.amazonaws.com
                org_sagebionetworks_table_cluster_endpoint_0: dev-${{ env.user }}-table-0.cdusmwdhqvso.us-east-1.rds.amazonaws.com
                org_sagebionetworks_search_enabled: false
                org_sagebionetworks_cloudfront_domainname: data.dev.sagebase.org
                m2_cache_parent_folder: .
                src_folder: .
              secrets-manager:
                org_sagebionetworks_stackEncryptionKey: org.sagebionetworks.stackEncryptionKey
                rds_password: build.rds.password
                org_sagebionetworks_cloudfront_keypair: org.sagebionetworks.cloudfront.private.key.id
                org_sagebionetworks_cloudfront_private_key_secret: build.org.sagebionetworks.cloudfront.private.key.secret
            phases:
              install:
                commands:
                  # https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/mysql-install-cli.html
                  - echo "Installing MySQL CLI"
                  # Note: 'dnf' works with the aws/codebuild/amazonlinux-x86_64-standard:5.0 image but
                  # does not seem to work with the :corretto11 image
                  - sudo dnf -y update && sudo dnf install -y mariadb105
              build:
                commands:
                  - aws sts get-caller-identity
                  # At this point the AWS role is codebuild-plfm9092-service-role, the service role associated with the Code Build project
                  # Added admin access to allow it to run a build
                  # But the build still failed.  I think the sts token isn't getting passed to the build
                  #- STS_CREDENTIALS=$(aws sts get-session-token)
                  #- export org_sagebionetworks_stack_iam_id=$(echo $STS_CREDENTIALS | jq -r '.Credentials''.AccessKeyId')
                  #- export org_sagebionetworks_stack_iam_key=$(echo $STS_CREDENTIALS | jq -r '.Credentials''.SecretAccessKey')
                  #- export org_sagebionetworks_stack_iam_session_token=$(echo $STS_CREDENTIALS | jq -r '.Credentials''.SessionToken')
                  - STS_CREDENTIALS=$(aws sts assume-role --role-arn arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-ops-dev --role-session-name build-stack)
                  - export org_sagebionetworks_stack_iam_id=$(echo $STS_CREDENTIALS | jq -r '.Credentials''.AccessKeyId')
                  - export org_sagebionetworks_stack_iam_key=$(echo $STS_CREDENTIALS | jq -r '.Credentials''.SecretAccessKey')
                  - export org_sagebionetworks_stack_iam_session_token=$(echo $STS_CREDENTIALS | jq -r '.Credentials''.SessionToken')
                  - echo org_sagebionetworks_stack_iam_id $org_sagebionetworks_stack_iam_id
                  - echo org_sagebionetworks_stack_iam_key $org_sagebionetworks_stack_iam_key
                  - echo org_sagebionetworks_stack_iam_session_token $org_sagebionetworks_stack_iam_session_token
                  - ./docker_build.sh
                #- aws sts assume-role --role-arn arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-ops-dev --role-session-name build-test
