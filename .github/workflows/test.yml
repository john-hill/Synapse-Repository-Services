
name: main

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['*']


jobs:
  # this is necessary to make env values available to later jobs
  get-env:
    runs-on: ubuntu-latest
    steps:
       - run: |
           echo "INSTANCE=${{ env.INSTANCE }}" >> $GITHUB_ENV
           echo "STACK_BRANCH=${{ env.STACK_BRANCH }}" >> $GITHUB_ENV

  build_and_test:
    needs: get-env
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::449435941126:role/sagebase-github-oidc-sage-bionetworks-synapse-ops-dev
          aws-region: us-east-1
          
      - name: Build and Test
        uses: aws-actions/aws-codebuild-run-build@v1
        with:
          project-name: plfm9092 
          region: us-east-1
          buildspec-override: |
            version: 0.2
            phases:
              build:
                commands:
                  - ./docker_build.sh
        env:
#         INSTANCE: devp3bhoff
          user: devp3bhoff
          stack: dev
          STACK_BRANCH: develop
          org_sagebionetworks_stack_iam_id: ${{ secrets.org_sagebionetworks_stack_iam_id }}
          org_sagebionetworks_stack_iam_key: ${{ secrets.org_sagebionetworks_stack_iam_key }}
          org_sagebionetworks_stackEncryptionKey: ${{ secrets.org_sagebionetworks_stackEncryptionKey }}
          rds_password: ${{ secrets.rds_password }}
          org_sagebionetworks_cloudfront_keypair: ${{ secrets.org_sagebionetworks_cloudfront_keypair }}
          org_sagebionetworks_cloudfront_private_key_secret: ${{ secrets.org_sagebionetworks_cloudfront_private_key_secret }}
          org_sagebionetworks_repository_database_connection_url: dev-p3bhoff-db.cdusmwdhqvso.us-east-1.rds.amazonaws.com
          org_sagebionetworks_table_cluster_endpoint_0: dev-p3bhoff-table-0.cdusmwdhqvso.us-east-1.rds.amazonaws.com
          org_sagebionetworks_search_enabled: false
          org_sagebionetworks_cloudfront_domainname: data.dev.sagebase.org
          m2_cache_parent_folder: .
        