AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create AWS CodeBuild project

Resources:
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: plfm9092 # TODO generalize this
      Source:
        Type: GITHUB
        Location: https://github.com/brucehoff/Synapse-Repository-Services # TODO generalize this
        GitCloneDepth: 1
        GitSubmodulesConfig:
          FetchSubmodules: false
        InsecureSsl: false
        ReportBuildStatus: false
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables: []
      # TODO service role should be created by the stack
      ServiceRole: arn:aws:iam::449435941126:role/service-role/codebuild-plfm9092-service-role
      TimeoutInMinutes: 600
      QueuedTimeoutInMinutes: 480
      EncryptionKey: arn:aws:kms:us-east-1:449435941126:alias/aws/s3
      VpcConfig:
        VpcId: vpc-0f126dc4dd46853a6
        Subnets:
          - subnet-0bbca9690202e2605
          - subnet-0e76448649e0636b4
          - subnet-08d6e58487e45e94f
          - subnet-0a05b9d8a855b3936
          - subnet-0ad4945b93afc68f4
          - subnet-094fb1d1838d905a3
        SecurityGroupIds:
          - sg-0818ba0f1872103d4
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
        S3Logs:
          Status: DISABLED
          EncryptionDisabled: false
      BadgeEnabled: false
      Visibility: PRIVATE
