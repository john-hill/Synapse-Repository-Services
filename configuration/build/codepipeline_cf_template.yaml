AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create AWS CodeBuild project
Parameters:
  RoleArn:
    Type: String
    Description: ARN of the IAM role to be used by CodePipeline
    Default: arn:aws:iam::449435941126:role/service-role/codebuild-plfm9092-service-role
  Branch:
    Type: String
    Default: PLFM-9092
    Description: Branch of the repo to build
  GitHubRepoOwner:
    Type: String
    Description: GitHub repository owner
  GitHubRepo:
    Type: String
    Default: Synapse-Repository-Services
    Description: GitHub repository name
  GitHubConnectionName:
    Type: String
    Description: ARN of the GitHub connection in AWS CodeStar Connections
    Default: plfm9092
  BuildImage:
    Type: String
    Description: CodeBuild image to use for the build
    Default: aws/codebuild/amazonlinux-x86_64-standard:5.0
  BuildComputeType:
    Type: String
    Description: CodeBuild compute type
    Default: BUILD_GENERAL1_MEDIUM
  VpcId:
    Type: String
    Description: VPC ID for CodeBuild to use. Default is the VPC for synapse-dev
    Default: vpc-0f126dc4dd46853a6
  Subnets:
    Type: CommaDelimitedList
    Description: Subnets for CodeBuild to use.  Default is a list of subnets for synapse-dev
    Default: subnet-0bbca9690202e2605,subnet-0e76448649e0636b4,subnet-08d6e58487e45e94f,subnet-0a05b9d8a855b3936,subnet-0ad4945b93afc68f4,subnet-094fb1d1838d905a3
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security group IDs for CodeBuild to use.  Default is a security group for synapse-dev.
    Default: sg-0818ba0f1872103d4
Resources:
  PipelineOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Ref GitHubConnectionName
      ProviderType: GitHub
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !Ref RoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineOutputBucket
      Name: !Sub 'SynapseBuild-${GitHubRepoOwner}'
      PipelineType: V2
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                FullRepositoryId: !Sub '${GitHubRepoOwner}/${GitHubRepo}'
                BranchName: !Ref Branch
                ConnectionArn: !Ref GitHubConnection
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              Configuration:
                ProjectName: !Sub 'SynapseBuild-${GitHubRepoOwner}' # TODO !Ref CodeBuildProject
              RunOrder: 2
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name:  !Sub 'SynapseBuild-${GitHubRepoOwner}'
      Source:
        Type: GITHUB
        Location: !Sub 'https://github.com/${GitHubRepoOwner}/${GitHubRepo}'
        GitCloneDepth: 1
        GitSubmodulesConfig:
          FetchSubmodules: false
        InsecureSsl: false
        ReportBuildStatus: false
      Artifacts:
        Type: NO_ARTIFACTS
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        Image: !Ref BuildImage
        ComputeType: !Ref BuildComputeType
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables: []
      ServiceRole: !Ref RoleArn
      TimeoutInMinutes: 600
      QueuedTimeoutInMinutes: 480
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref Subnets
        SecurityGroupIds: !Ref SecurityGroupIds
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
        S3Logs:
          Status: DISABLED
          EncryptionDisabled: false
      BadgeEnabled: false
      Visibility: PRIVATE
