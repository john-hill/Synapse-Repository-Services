AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create AWS CodeBuild project
Parameters:
  SynapseRepository:
    Type: String
    Default: Synapse-Repository-Services
    Description: Synapse repository name
  SynapseBranch:
    Type: String
    Default: PLFM-9092
    Description: Branch of the Synapse repo to build
  SynapseRepoOwner:
    Type: String
    Description: Owner of the Synapse Repo to build
    AllowedPattern: ".+"
    ConstraintDescription: Parameter cannot be empty.
  GitHubToken:
    Type: String
    Description: Token to authorize GitHub requests
    AllowedPattern: ".+"
    ConstraintDescription: Parameter cannot be empty.
  BuildParamUser:
    Type: String
    Description: The 'user' param for the Synapse build, e.g. 'pjmhill'
    AllowedPattern: ".+"
    ConstraintDescription: Parameter cannot be empty.
  BuildImage:
    Type: String
    Description: CodeBuild image to use for the build
    Default: aws/codebuild/amazonlinux-x86_64-standard:5.0
  BuildComputeType:
    Type: String
    Description: CodeBuild compute type
    Default: BUILD_GENERAL1_MEDIUM
  VpcId:
    Type: String
    Description: VPC ID for CodeBuild to use. Default is the VPC for synapse-dev
    Default: vpc-0f126dc4dd46853a6
  Subnets:
    Type: CommaDelimitedList
    Description: Subnets for CodeBuild to use.  Default is a list of subnets for synapse-dev
    Default: subnet-0bbca9690202e2605,subnet-0e76448649e0636b4,subnet-08d6e58487e45e94f,subnet-0a05b9d8a855b3936,subnet-0ad4945b93afc68f4,subnet-094fb1d1838d905a3
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security group IDs for CodeBuild to use.  Default is a security group for synapse-dev.
    Default: sg-0818ba0f1872103d4
Resources:
  # 
#  CodePipelineExecutionRole:
#    Type: AWS::IAM::Role
#    ????
#  CodeBuildExecutionRole:
#    Type: AWS::IAM::Role
#    ????
# TODO this stack should define its execution role
  RoleArn:
    Type: String
    Description: ARN of the IAM role to be used by CodePipeline
    Default: arn:aws:iam::449435941126:role/service-role/codebuild-plfm9092-service-role
  PipelineOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !Ref RoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineOutputBucket
      PipelineType: V2
      Stages:
        - Name: CheckoutSynapseRepo
          Actions:
            - Name: CheckoutSynapseRepo
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: 1
              OutputArtifacts:
                - Name: SynapseRepoSource
              Configuration:
                Owner: !Ref SynapseRepoOwner
                Repo: !Ref SynapseRepository
                Branch: !Ref SynapseBranch
                OAuthToken: !Ref GitHubToken
              RunOrder: 1
        - Name: BuildSynapseRepo
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SynapseRepoSource
              OutputArtifacts:
                - Name: SynapseRepoBuildOutput
              Configuration:
                ProjectName: !Ref CodeBuildProject
                EnvironmentVariables: !Sub '[{"name":"user","type":"PLAINTEXT","value": "${BuildParamUser}"}]'
                BuildspecOverride: |
                  version: 0.2
                  env:
                    variables:
                      stack: dev
                      org_sagebionetworks_search_enabled: false
                      org_sagebionetworks_cloudfront_domainname: data.dev.sagebase.org
                      m2_cache_parent_folder: .
                      src_folder: .
                    secrets-manager:
                      org_sagebionetworks_stackEncryptionKey: org.sagebionetworks.stackEncryptionKey
                      rds_password: build.rds.password
                      org_sagebionetworks_cloudfront_keypair: org.sagebionetworks.cloudfront.private.key.id
                      org_sagebionetworks_cloudfront_private_key_secret: build.org.sagebionetworks.cloudfront.private.key.secret
                  phases:
                    install:
                      commands:
                        # https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/mysql-install-cli.html
                        - echo "Installing MySQL CLI"
                        # Note: 'dnf' works with the aws/codebuild/amazonlinux-x86_64-standard:5.0 image but
                        # does not seem to work with the :corretto11 image
                        - sudo dnf -y update && sudo dnf install -y mariadb105
                    build:
                      commands:
                        # At this point the AWS role is codebuild-plfm9092-service-role, the service role associated with the Code Build project
                        - aws sts get-caller-identity
                        - STS_CREDENTIALS=$(curl -L http://169.254.170.2/$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI)
                        - export org_sagebionetworks_stack_iam_id=$(echo $STS_CREDENTIALS | jq -r '.AccessKeyId')
                        - export org_sagebionetworks_stack_iam_key=$(echo $STS_CREDENTIALS | jq -r '.SecretAccessKey')
                        - export org_sagebionetworks_stack_iam_session_token=$(echo $STS_CREDENTIALS | jq -r '.Token')
                        - echo Credential Expiration **Duration should be 8 hours**
                        - echo $STS_CREDENTIALS | jq -r '.Expiration'
                        - export org_sagebionetworks_repository_database_connection_url=dev-${user}-db.cdusmwdhqvso.us-east-1.rds.amazonaws.com
                        - export org_sagebionetworks_table_cluster_endpoint_0=dev-${user}-table-0.cdusmwdhqvso.us-east-1.rds.amazonaws.com
                        # TODO remove the following line after testing
                        - export EXTRA_ARGS=-Dmaven.test.skip=true
                        - ./docker_build.sh
              RunOrder: 2
  # A CodeBuild project that can be used to run the stack builder or to build the Synapse back-end
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Source:
        Type: CODEPIPELINE
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        Image: !Ref BuildImage
        ComputeType: !Ref BuildComputeType
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
      ServiceRole: !Ref RoleArn
      TimeoutInMinutes: 600
      QueuedTimeoutInMinutes: 480
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref Subnets
        SecurityGroupIds: !Ref SecurityGroupIds
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
        S3Logs:
          Status: DISABLED
          EncryptionDisabled: false
      BadgeEnabled: false
      Visibility: PRIVATE
