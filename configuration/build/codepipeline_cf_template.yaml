AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create AWS CodeBuild project
Parameters:
  SynapseRepository:
    Type: String
    Default: Synapse-Repository-Services
    Description: Synapse repository name
  SynapseBranch:
    Type: String
    Description: Branch of the Synapse repo to build
    AllowedPattern: ".+"
  SynapseRepoOwner:
    Type: String
    Description: Owner of the Synapse Repo to build
    AllowedPattern: ".+"
    ConstraintDescription: Parameter cannot be empty.
  GitHubToken:
    Type: String
    Description: Token to authorize GitHub requests
    AllowedPattern: ".+"
    ConstraintDescription: Parameter cannot be empty.
  BuildParamUser:
    Type: String
    Description: The 'user' param for the Synapse build, e.g. 'pjmhill'
    AllowedPattern: ".+"
    ConstraintDescription: Parameter cannot be empty.
  BuildImage:
    Type: String
    Description: CodeBuild image to use for the build
    Default: aws/codebuild/amazonlinux-x86_64-standard:5.0
  BuildComputeType:
    Type: String
    Description: CodeBuild compute type
    Default: BUILD_GENERAL1_MEDIUM
  VpcId:
    Type: String
    Description: VPC ID for CodeBuild to use. Default is the VPC for synapse-dev
    Default: vpc-0f126dc4dd46853a6
  Subnets:
    Type: CommaDelimitedList
    Description: Subnets for CodeBuild to use.  Default is a list of subnets for synapse-dev
    Default: subnet-0bbca9690202e2605,subnet-0e76448649e0636b4,subnet-08d6e58487e45e94f,subnet-0a05b9d8a855b3936,subnet-0ad4945b93afc68f4,subnet-094fb1d1838d905a3
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security group IDs for CodeBuild to use.  Default is a security group for synapse-dev.
    Default: sg-0818ba0f1872103d4
Outputs:
  PipelineName:
    Value:
      Ref: !GetAtt CodePipeline.Name
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-pipeline-name
Resources:
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permission to use S3 artifact store
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub "${PipelineOutputBucket.Arn}/*"
                  - !GetAtt PipelineOutputBucket.Arn
              # Permission to invoke CodeBuild
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Permission to access artifacts
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${PipelineOutputBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - ec2:*
                Resource:
                  - '*'
  PipelineOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineOutputBucket
      PipelineType: V2
      Stages:
        - Name: CheckoutSynapseRepo
          Actions:
            - Name: CheckoutSynapseRepo
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: 1
              OutputArtifacts:
                - Name: SynapseRepoSource
              Configuration:
                Owner: !Ref SynapseRepoOwner
                Repo: !Ref SynapseRepository
                Branch: !Ref SynapseBranch
                OAuthToken: !Ref GitHubToken
                PollForSourceChanges: false # instead we will trigger from GitHub workflow
              RunOrder: 1
        - Name: BuildSynapseRepo
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SynapseRepoSource
              OutputArtifacts:
                - Name: SynapseRepoBuildOutput
              Configuration:
                ProjectName: !Ref CodeBuildProject
                EnvironmentVariables: !Sub '[{"name":"user","type":"PLAINTEXT","value": "${BuildParamUser}"}]'
                BuildspecOverride: configuration/build/buildspec.yml
              RunOrder: 2
  # A CodeBuild project that can be used to run the stack builder or to build the Synapse back-end
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Source:
        Type: CODEPIPELINE
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        Image: !Ref BuildImage
        ComputeType: !Ref BuildComputeType
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      TimeoutInMinutes: 600
      QueuedTimeoutInMinutes: 480
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref Subnets
        SecurityGroupIds: !Ref SecurityGroupIds
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
        S3Logs:
          Status: DISABLED
          EncryptionDisabled: false
      BadgeEnabled: false
      Visibility: PRIVATE
