AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create AWS CodeBuild project
Parameters:
# TODO this stack should define its execution role
  RoleArn:
    Type: String
    Description: ARN of the IAM role to be used by CodePipeline
    Default: arn:aws:iam::449435941126:role/service-role/codebuild-plfm9092-service-role
  FullSynapseRepositoryId:
    Type: String
    Default: Sage-Bionetworks/Synapse-Repository-Services
    Description: Full Synapse repository Id, <owner>/<repo-name>
  SynapseBranch:
    Type: String
    Default: PLFM-9092
    Description: Branch of the Synapse repo to build
  GitHubUser:
    Type: String
    Description: Handle of GitHub user
    AllowedPattern: ".+"
    ConstraintDescription: Parameter cannot be empty.
  BuildParamUser:
    Type: String
    Description: The 'user' param for the Synapse build, e.g. 'pjmhill'
    AllowedPattern: ".+"
    ConstraintDescription: Parameter cannot be empty.
  BuildImage:
    Type: String
    Description: CodeBuild image to use for the build
    Default: aws/codebuild/amazonlinux-x86_64-standard:5.0
  BuildComputeType:
    Type: String
    Description: CodeBuild compute type
    Default: BUILD_GENERAL1_MEDIUM
  VpcId:
    Type: String
    Description: VPC ID for CodeBuild to use. Default is the VPC for synapse-dev
    Default: vpc-0f126dc4dd46853a6
  Subnets:
    Type: CommaDelimitedList
    Description: Subnets for CodeBuild to use.  Default is a list of subnets for synapse-dev
    Default: subnet-0bbca9690202e2605,subnet-0e76448649e0636b4,subnet-08d6e58487e45e94f,subnet-0a05b9d8a855b3936,subnet-0ad4945b93afc68f4,subnet-094fb1d1838d905a3
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security group IDs for CodeBuild to use.  Default is a security group for synapse-dev.
    Default: sg-0818ba0f1872103d4
Resources:
  PipelineOutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub '${GitHubUser}'
      ProviderType: GitHub
  CodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !Ref RoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineOutputBucket
      Name: !Sub 'SynapseBuild-${GitHubUser}'
      PipelineType: V2
      Stages:
        - Name: CheckoutSynapseRepo
          Actions:
            - Name: CheckoutSynapseRepo
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              OutputArtifacts:
                - Name: SynapseRepoSource
              Configuration:
                FullRepositoryId: !Sub '${FullSynapseRepositoryId}'
                BranchName: !Ref SynapseBranch
                ConnectionArn: !Ref GitHubConnection
              RunOrder: 1
        - Name: BuildSynapseRepo
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: 1
              InputArtifacts:
                - Name: SynapseRepoSource
              OutputArtifacts:
                - Name: SynapseRepoBuildOutput
              Configuration:
                ProjectName: !Ref CodeBuildProject
                EnvironmentVariables: !Sub '[{"name":"user","type":"PLAINTEXT","value": "${BuildParamUser}"}]'
              RunOrder: 2
  # A CodeBuild project that can be used to run the stack builder or to build the Synapse back-end
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name:  !Sub 'CodeBuild-${GitHubUser}'
      Source:
        Type: CODEPIPELINE
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: NO_CACHE
      Environment:
        Type: LINUX_CONTAINER
        Image: !Ref BuildImage
        ComputeType: !Ref BuildComputeType
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
      ServiceRole: !Ref RoleArn
      TimeoutInMinutes: 600
      QueuedTimeoutInMinutes: 480
      VpcConfig:
        VpcId: !Ref VpcId
        Subnets: !Ref Subnets
        SecurityGroupIds: !Ref SecurityGroupIds
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
        S3Logs:
          Status: DISABLED
          EncryptionDisabled: false
      BadgeEnabled: false
      Visibility: PRIVATE
